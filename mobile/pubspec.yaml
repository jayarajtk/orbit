name: orbit
description: "Orbit: fast, private, ad-free people-nearby app for iOS and Android."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.3

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_appauth: ^12.1.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.2
  go_router: ^17.5.0
  image_picker: ^1.2.4
  intl: any
  just_audio: ^0.10.6
  record: ^6.2.1
  video_player: ^2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true
  generate: true
