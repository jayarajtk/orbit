# Environment-specific values come from environment variables using Spring's relaxed binding:
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
#   SPRING_DATA_REDIS_URL
#   SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUERURI
#   SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES
# Startup fails fast when the datasource or the OIDC issuer is missing.
spring:
  application:
    name: orbit-api
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
