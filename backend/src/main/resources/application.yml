# Environment-specific values come from environment variables using Spring's relaxed binding:
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
#   SPRING_DATA_REDIS_URL
#   SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUERURI
#   SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES
#   ORBIT_MEDIA_BUCKET, ORBIT_MEDIA_REGION (S3 credentials come from the AWS default chain)
# Startup fails fast when the datasource, the OIDC issuer or the media bucket is missing.
spring:
  application:
    name: orbit-api
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

orbit:
  media:
    region: us-east-1
  chat:
    wave-limit: 2
    wave-window: PT24H
